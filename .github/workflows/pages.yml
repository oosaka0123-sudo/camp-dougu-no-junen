name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - name: Generate 720p silent opening film
        run: |
          mkdir -p public/media
          ffmpeg -y -f lavfi -i "color=c=0x26352c:s=1280x720:d=4.3:r=24"             -vf "drawbox=x=70:y=60:w=1140:h=600:color=0xf4efe3@0.12:t=2,drawbox=x=0:y=500:w=1280:h=220:color=0x673724@0.28:t=fill,vignette=PI/5"             -an -c:v libvpx-vp9 -crf 38 -b:v 0 -pix_fmt yuv420p public/media/opening.webm
          test -s public/media/opening.webm
      - run: npm run build
        env:
          SITE_URL: https://oosaka0123-sudo.github.io/camp-dougu-no-junen/
          BASE_PATH: /camp-dougu-no-junen/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
