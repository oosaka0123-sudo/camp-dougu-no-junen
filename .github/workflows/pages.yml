name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - name: Verify user opening film
        run: |
          test -s public/media/opening.mp4
          echo "79c749cfbcd9c0c03c6868dc86ccc67b1885b6100e353b57ff933593369c9b0f  public/media/opening.mp4" | sha256sum -c -
          test "$(stat -c%s public/media/opening.mp4)" -lt 1500000
      - run: npm run build
        env:
          SITE_URL: https://oosaka0123-sudo.github.io/camp-dougu-no-junen/
          BASE_PATH: /camp-dougu-no-junen/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
