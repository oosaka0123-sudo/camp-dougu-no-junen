name: Browser QA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify user opening film
        run: |
          test -s public/media/opening.mp4
          echo "79c749cfbcd9c0c03c6868dc86ccc67b1885b6100e353b57ff933593369c9b0f  public/media/opening.mp4" | sha256sum -c -
      - name: Build
        run: npm run build
        env:
          SITE_URL: http://127.0.0.1:4173/
          BASE_PATH: /
      - name: Start static server
        run: |
          python3 -m http.server 4173 -d dist > /tmp/camp-http.log 2>&1 &
          sleep 2
      - name: Run browser QA
        run: node scripts/browser-qa.mjs
        env:
          QA_BASE_URL: http://127.0.0.1:4173/
